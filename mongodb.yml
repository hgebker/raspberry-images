services:
  mongodb-dev:
    container_name: mongodb-dev
    image: "mongo:4.4.18"
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-dev:/data/db

  mongodb-prod:
    container_name: mongodb-prod
    image: "mongo:4.4.18"
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "27007:27017"
    volumes:
      - mongo-data-prod:/data/db

volumes:
  mongo-data-dev:
  mongo-data-prod:

networks:
  default:
    external: true
    name: doko-kasse
